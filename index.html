<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Private Letter 💖</title>
<style>
:root {
    --primary-pink: #ffb7c5;
    --deep-red: #ff4d6d;
    --soft-white: #fff5f6;
    --envelope-bg: #ffffff;
    --envelope-dark: #f8bbd0;
}

body {
    margin: 0; padding: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, var(--soft-white), var(--primary-pink));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; overflow: hidden;
}

/* ENVELOPE STYLING */
.envelope-wrapper {
    position: relative;
    width: 300px;
    height: 200px;
    z-index: 10;
    transition: transform 0.8s ease;
}

.envelope {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--envelope-bg);
    border-radius: 0 0 15px 15px;
    box-shadow: 0 15px 35px rgba(255, 77, 109, 0.2);
}

.flap {
    position: absolute;
    top: 0;
    width: 0; height: 0;
    border-left: 150px solid transparent;
    border-right: 150px solid transparent;
    border-top: 100px solid var(--primary-pink);
    border-radius: 15px 15px 0 0;
    transform-origin: top;
    transition: transform 0.6s ease;
    z-index: 3;
}



/* INPUT BOX STYLING */
.login-container {
    margin-top: 40px;
    text-align: center;
    z-index: 5;
}

#love-pass {
    padding: 12px;
    border-radius: 15px;
    border: 2px solid var(--primary-pink);
    text-align: center;
    outline: none;
    font-size: 1rem;
    width: 200px;
    transition: 0.3s;
}

#love-pass.shake {
    animation: shake 0.4s;
    border-color: var(--deep-red);
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
}

.seal {
    position: absolute;
    top: 75px; left: 50%;
    transform: translateX(-50%);
    width: 50px; height: 50px;
    background: var(--deep-red);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 20px;
    z-index: 4;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: 0.5s;
}

/* OPENING ANIMATION */
.envelope-wrapper.opened .flap {
    transform: rotateX(180deg);
    z-index: 1;
}
.envelope-wrapper.opened .seal {
    opacity: 0;
    transform: translateX(-50%) scale(0);
}

#login-error {
    color: var(--deep-red);
    font-size: 0.85rem;
    margin-top: 10px;
    font-weight: bold;
    display: none;
}

h2 { color: #444; font-size: 1.1rem; margin-bottom: 20px; }
</style>
</head>
<body>

    <img src="/image/giphy.gif" alt="Cute Heart" style="width:100px; margin-bottom: 20px;">
    <h2>This letter is locked... 🔒</h2>

    <div class="envelope-wrapper" id="env-wrap">
        <div class="flap"></div>
        <div class="envelope">
            <div class="seal" id="seal">❤️</div>
        </div>
        
    </div>

    <div class="login-container">
        <input type="text" id="love-pass" autocomplete="off" placeholder="Enter our date (MMDDYYYY)">
        <br>
        <p id="login-error">Ano bayan kalimutan na? 😒</p>
        <button onclick="unlock()" style="margin-top: 15px; background: var(--deep-red); color: white; border: none; padding: 10px 25px; border-radius: 50px; cursor: pointer; font-weight: bold;">Unlock Letter</button>
    </div>

<script>
function unlock() {
    const inputField = document.getElementById("love-pass");
    const input = inputField.value.trim().toLowerCase();
    const errorText = document.getElementById("login-error");
    const wrapper = document.getElementById("env-wrap");

    // Your valid dates
    const valid1 = "10042022"; 
    const valid2 = "october42022";
    const valid3 = "1042022";

    if (input === valid1 || input === valid2 || input === valid3) {
        errorText.style.display = "none";
        // 1. Open Envelope
        wrapper.classList.add("opened");
        
        // 2. Wait for animation then redirect
        setTimeout(() => {
            window.location.href = "valentine.html"; 
        }, 1200);
    } else {
        errorText.style.display = "block";
        inputField.classList.add("shake");
        setTimeout(() => inputField.classList.remove("shake"), 400);
    }
}

// Clean input
document.getElementById("love-pass").addEventListener("input", function() {
    this.value = this.value.replace(/[^a-zA-Z0-9]/g, '');
});

// Enter key
document.getElementById("love-pass").addEventListener("keypress", function(e) {
    if (e.key === "Enter") { unlock(); }
});
</script>

</body>
</html>
